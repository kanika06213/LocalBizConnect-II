<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LocalBizConnect</title>
    <meta name="description" content="Sign in to your LocalBizConnect account to manage your businesses, products, or reviews.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="nav-brand">
                <span class="brand-icon">⚡</span>
                <span class="brand-text">LocalBiz<span>Connect</span></span>
            </a>

            <div class="nav-auth" id="nav-auth-actions">
                <a href="register.html" class="nav-link">Don't have an account? Register</a>
            </div>
        </div>
    </header>

    <!-- Login Card -->
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <span class="section-tag">Welcome Back</span>
                <h1 class="auth-title">Account Login</h1>
                <p class="auth-subtitle">Sign in with your email address and password.</p>
            </div>

            <form id="login-form">
                <!-- Email -->
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" required placeholder="john@example.com">
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
                    Sign In
                </button>
            </form>

            <!-- Demo Accounts Box -->
            <div class="demo-accounts-box" style="margin-top: 1.5rem; padding: 1rem; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: var(--radius-md); font-size: 0.88rem;">
                <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between;">
                    <span>⚡ Demo Accounts</span>
                    <span style="font-size: 0.75rem; color: #64748b; font-weight: normal;">Click to auto-fill</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <button type="button" class="btn btn-outline btn-sm" style="text-align: left; justify-content: space-between; display: flex;" onclick="fillDemo('customer@demo.com', 'customer123')">
                        <span>🛍️ <strong>Customer:</strong> customer@demo.com</span>
                        <span style="color: #64748b; font-size: 0.8rem;">customer123</span>
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" style="text-align: left; justify-content: space-between; display: flex;" onclick="fillDemo('seller@demo.com', 'seller123')">
                        <span>🏪 <strong>Seller:</strong> seller@demo.com</span>
                        <span style="color: #64748b; font-size: 0.8rem;">seller123</span>
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" style="text-align: left; justify-content: space-between; display: flex;" onclick="fillDemo('admin@demo.com', 'admin123')">
                        <span>🛡️ <strong>Admin:</strong> admin@demo.com</span>
                        <span style="color: #64748b; font-size: 0.8rem;">admin123</span>
                    </button>
                </div>
            </div>

            <div class="auth-footer">
                New to LocalBizConnect? <a href="register.html">Create an Account</a>
            </div>
        </div>
    </main>

    <!-- JavaScript Files -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function fillDemo(email, password) {
            document.getElementById("login-email").value = email;
            document.getElementById("login-password").value = password;
        }

        // Redirect if already logged in
        redirectIfLoggedIn();

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById("login-submit-btn");

            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = "Authenticating...";

                // Real backend API: POST /api/users/login
                const res = await api.post("/users/login", {
                    email,
                    password
                });

                showToast("Login successful! Redirecting to dashboard...", "success");

                // Store JWT and user info in localStorage as required
                localStorage.setItem("token", res.token);
                localStorage.setItem("user", JSON.stringify(res.user));

                setTimeout(() => {
                    // Check if redirect was requested earlier
                    const redirect = sessionStorage.getItem("redirect_after_login");
                    if (redirect) {
                        sessionStorage.removeItem("redirect_after_login");
                        window.location.href = redirect;
                    } else {
                        window.location.href = "dashboard.html";
                    }
                }, 700);
            } catch (error) {
                showToast(error.message || "Invalid credentials. Please try again.", "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
